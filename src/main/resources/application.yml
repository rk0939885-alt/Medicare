server:
  port: ${PORT:8080}

spring:
  application:
    name: medicare
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medconnect}
    username: postgres
    password: postgres
  jpa:
    
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/medicare}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true